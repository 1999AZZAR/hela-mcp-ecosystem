name: Deploy Developer Platform to GitHub Pages & gh-pages Branch

on:
  push:
    branches:
      - master
    paths:
      - 'docs/site/**'
      - 'assets/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Static Site Distribution
        run: |
          mkdir -p _site
          # Copy all web platform files from docs/site/ to root of _site
          cp -r docs/site/* _site/
          # Ensure assets/ directory exists in _site for Blotcat illustrations and icons
          mkdir -p _site/assets
          cp -r assets/* _site/assets/
          # Ensure .nojekyll is present so GitHub Pages does not ignore files starting with underscores
          touch _site/.nojekyll

      - name: Deploy to Dedicated gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy(site): automated build and sync from master (${{ github.sha }})'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

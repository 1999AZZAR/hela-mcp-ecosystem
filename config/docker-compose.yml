version: '3.8'

# HeLa MCP Ecosystem — Docker Compose Configuration
# Environment variables can be defined in a .env file

services:
  # HeLa Mitosis (Chaining MCP) — Orchestration Backbone
  hela-mitosis:
    build:
      context: ../chaining-mcp-server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - SEQUENTIAL_THINKING_AVAILABLE=true
      - AWESOME_COPILOT_ENABLED=true
      - RELIABILITY_MONITORING_ENABLED=true
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    volumes:
      - ./data:/app/data
    depends_on:
      - hela-membrane
      - hela-genome
      - hela-nucleus
      - hela-enzyme
      - hela-cytosol
    networks:
      - mcp-network

  # HeLa Membrane (Filesystem MCP) — Workspace Boundary
  hela-membrane:
    build:
      context: ../filesystem-mcp-server
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    volumes:
      - ./workspace:/workspace
    networks:
      - mcp-network

  # HeLa Genome (Project Guardian) — Persistent State Backbone
  hela-genome:
    build:
      context: ../Project-Guardian-mcp-server
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    volumes:
      - ./data:/app/data
    networks:
      - mcp-network

  # HeLa Nucleus (Terminal MCP) — Command Execution
  hela-nucleus:
    build:
      context: ../terminal-mcp-server
      dockerfile: Dockerfile
    ports:
      - "3004:3004"
    privileged: true
    networks:
      - mcp-network

  # HeLa Ribosome (Menager MCP) — PTY Terminal Harness
  hela-ribosome:
    build:
      context: ../menager-mcp-server
      dockerfile: Dockerfile
    ports:
      - "3007:3007"
    privileged: true
    networks:
      - mcp-network

  # HeLa Enzyme (Researcher MCP) — Unified Research Engine
  hela-enzyme:
    build:
      context: ../research-mcp-server
      dockerfile: Dockerfile
    ports:
      - "3005:3005"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_CSE_ID=${GOOGLE_SEARCH_ENGINE_ID}
    networks:
      - mcp-network

  # HeLa Cytosol (Browser Agent) — Web Interaction
  hela-cytosol:
    build:
      context: ../browser-agent
      dockerfile: Dockerfile
    ports:
      - "3006:3006"
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge

volumes:
  workspace:
    driver: local
  data:
    driver: local

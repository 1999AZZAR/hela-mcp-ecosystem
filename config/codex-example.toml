args = ["/path/to/mcp-ecosystem/filesystem-mcp-server/dist/index.js"]

[mcpServers.hela-nucleus]
command = "node"
args = ["/path/to/mcp-ecosystem/terminal-mcp-server/build/index.js"]

[mcpServers.hela-ribosome]
command = "node"
args = ["/path/to/mcp-ecosystem/menager-mcp-server/build/index.js"]

[mcpServers.hela-enzyme]
